<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Interest Request — InvestMatch Nepal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#f6f3f1; padding:2rem;">
  <!-- Reusable Header -->
  <div id="header-root"></div>
  <script src="components.js"></script>
  <script>injectHeader('public');</script>

  <div class="modal-content" style="margin: 40px auto; max-width:480px;">
    <h3>Send Interest Request</h3>
    <p style="margin:1rem 0;">You are about to express interest in <strong>Aarohan Kitchens</strong>. The founder will see your full profile.</p>
    
    <div class="input-group">
      <label>Optional message (≤250 characters)</label>
      <textarea style="height:90px;">Excited by your traction numbers and the clear path to scale across Province 1 and 2.</textarea>
    </div>
    
    <button onclick="alert('Interest request sent successfully (demo).'); window.location='investor-dashboard.html'" class="btn btn-primary" style="width:100%;">Send Request</button>
    <div style="text-align:center; margin-top:0.75rem; font-size:0.8rem;"><a href="public-pitch-detail.html">Cancel</a></div>
  </div>
</body>
</html>
